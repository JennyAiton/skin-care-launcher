<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#3a0d22;color:#fff;font-family:Georgia,serif}

<body><main><img src="icon-512.png" alt="Pillbox icon"><h1>Pillbox</h1><p id="msg">Jenny's pillbox</p>
